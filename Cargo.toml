[package]
name = "subr"
description = "Spend spare AI subscription quota on background coding work, within a daily limit"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/lum1n/subr"
license = "MIT"

[dependencies]
# Pinned: acc is young and moves fast. All of subr's use of it is in src/harness.rs.
acc-core = { git = "https://github.com/lum1n/acc", rev = "984b193f63fcd6d979540eb8b4d661b332ed0484" }
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
globset = "0.4.20"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
